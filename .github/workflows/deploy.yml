name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Build and deploy the React frontend to GitHub Pages ───────────────
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Firebase client config — these values are intentionally public.
          # They identify the project; security is enforced by Firestore rules.
          # VITE_ANTHROPIC_KEY is intentionally absent: the Anthropic key is
          # stored as a Firebase Secret (ANTHROPIC_KEY) and never built into
          # the frontend bundle.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # ── 2. Deploy Cloud Functions when functions/ changes ────────────────────
  # Requires FIREBASE_SERVICE_ACCOUNT secret (download from Firebase Console
  # → Project Settings → Service accounts → Generate new private key).
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    # Only run when functions source or config changes
    if: |
      contains(github.event.commits[0].modified, 'functions/') ||
      contains(github.event.commits[0].added, 'functions/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies and build
        run: |
          cd functions
          npm ci
          npm run build

      - name: Deploy functions
        run: firebase deploy --only functions --project tripp-9be77
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Inline the credentials for firebase-tools
        # Note: set ANTHROPIC_KEY via firebase CLI *before* deploying:
        #   firebase functions:secrets:set ANTHROPIC_KEY
        # The secret is stored in Google Secret Manager and injected at runtime.
